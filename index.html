<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>भारत की प्रमुख मृदाएँ</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
padding:0;
}

header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
width:95%;
max-width:1200px;
margin:auto;
padding:20px;
}

#map{
width:100%;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

.buttons{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
margin-top:20px;
}

button{
padding:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
border:none;
border-radius:8px;
background:#0d6efd;
color:white;
}

button:hover{
opacity:.9;
}

#info{
background:white;
margin-top:20px;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
line-height:1.8;
}

h2{
color:#0d6efd;
}

</style>
</head>
<body>

<header>
भारत की प्रमुख मृदाएँ
</header>

<div class="container">

<!-- यहां अपनी map image का नाम डालना -->
<img id="map" src="india-soil-map.png" alt="भारत की मृदा">

<div class="buttons">

<button onclick="showInfo('jalodh')">जलोढ़ मृदा</button>

<button onclick="showInfo('lal')">लाल एवं पीली मृदा</button>

<button onclick="showInfo('kali')">काली मृदा</button>

<button onclick="showInfo('laterite')">लेटराइट मृदा</button>

<button onclick="showInfo('parvatiya')">पर्वतीय मृदा</button>

<button onclick="showInfo('balui')">बलुई मृदा</button>

<button onclick="showInfo('lavniya')">लवणीय / क्षारीय मृदा</button>

<button onclick="showInfo('peat')">दलदली / पीट मृदा</button>

</div>

<div id="info">

<h2>निर्देश</h2>

किसी मृदा पर क्लिक करें। नीचे उसकी पूरी जानकारी दिखाई देगी।

</div>

</div>

<script>

const soils = {

jalodh: `
<h2>जलोढ़ मृदा</h2>

भारत की सबसे उपजाऊ मृदा।

<b>क्षेत्र:</b>
उत्तर प्रदेश, बिहार, पंजाब, हरियाणा, पश्चिम बंगाल, असम।

<b>फसलें:</b>
गेहूँ, धान, गन्ना, जूट।
`,

lal: `
<h2>लाल एवं पीली मृदा</h2>

लौह ऑक्साइड की अधिकता के कारण लाल रंग।

<b>क्षेत्र:</b>
तमिलनाडु, तेलंगाना, झारखंड, छत्तीसगढ़, ओडिशा।

<b>फसलें:</b>
मूंगफली, दालें, बाजरा।
`,

kali: `
<h2>काली मृदा</h2>

इसे रेगर मृदा भी कहते हैं।

<b>क्षेत्र:</b>
महाराष्ट्र, गुजरात, मध्य प्रदेश।

<b>फसल:</b>
कपास।
`,

laterite: `
<h2>लेटराइट मृदा</h2>

अधिक वर्षा वाले क्षेत्रों में।

<b>क्षेत्र:</b>
केरल, कर्नाटक, तमिलनाडु, ओडिशा।
`,

parvatiya: `
<h2>पर्वतीय मृदा</h2>

हिमालयी क्षेत्रों की प्रमुख मृदा।

<b>क्षेत्र:</b>
उत्तराखंड, हिमाचल प्रदेश, जम्मू-कश्मीर।
`,

balui: `
<h2>बलुई मृदा</h2>

जल धारण क्षमता कम।

<b>क्षेत्र:</b>
पश्चिमी राजस्थान।
`,

lavniya: `
<h2>लवणीय / क्षारीय मृदा</h2>

लवणों की मात्रा अधिक।

<b>क्षेत्र:</b>
गुजरात, राजस्थान, हरियाणा।
`,

peat: `
<h2>दलदली / पीट मृदा</h2>

कार्बनिक पदार्थों से भरपूर।

<b>क्षेत्र:</b>
केरल, सुंदरवन, असम।
`

};

function showInfo(soil){

document.getElementById("info").innerHTML = soils[soil];

document.getElementById("info").scrollIntoView({
behavior:"smooth"
});

}

</script>

</body>
</html>
