<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>भारत की प्रमुख मृदाएँ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Nirmala UI",sans-serif;
}

body{
background:#f4f6f8;
}

header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.container{
width:95%;
max-width:1400px;
margin:auto;
padding:20px;
}

.buttons{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
margin-bottom:20px;
}

button{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
font-weight:bold;
color:white;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}

.jalodh{background:#4CAF50;}
.lal{background:#e53935;}
.kali{background:#424242;}
.laterite{background:#fb8c00;}
.parvatiy{background:#8e24aa;}
.disabled{background:#9e9e9e;}

.main{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

#soilMap{
width:100%;
border-radius:10px;
}

#info{
line-height:1.8;
font-size:17px;
}

#info h2{
margin-bottom:10px;
color:#0d6efd;
}

#info ul{
padding-left:20px;
}

@media(max-width:900px){

.main{
grid-template-columns:1fr;
}

}

</style>
</head>
<body>

<header>
भारत की प्रमुख मृदाएँ
</header>

<div class="container">

<div class="buttons">

<button class="jalodh" onclick="showSoil('jalodh')">
जलोढ़ मृदा
</button>

<button class="lal" onclick="showSoil('lal')">
लाल एवं पीली मृदा
</button>

<button class="kali" onclick="showSoil('kali')">
काली मृदा
</button>

<button class="laterite" onclick="showSoil('laterite')">
लेटराइट मृदा
</button>

<button class="parvatiy" onclick="showSoil('parvatiy')">
पर्वतीय मृदा
</button>

<button class="disabled" onclick="comingSoon()">
बलुई मृदा
</button>

<button class="disabled" onclick="comingSoon()">
लवणीय/क्षारीय मृदा
</button>

<button class="disabled" onclick="comingSoon()">
दलदली/पीट मृदा
</button>

</div>

<div class="main">

<div class="card">

<img id="soilMap"
src="jalodh.png"
alt="मृदा मानचित्र">

</div>

<div class="card">

<div id="info">

<h2>जलोढ़ मृदा</h2>

<p>
भारत की सबसे उपजाऊ मृदा।
गंगा, ब्रह्मपुत्र तथा सिंधु नदी तंत्र द्वारा निर्मित।
</p>

<h3>प्रमुख क्षेत्र</h3>

<ul>
<li>उत्तर प्रदेश</li>
<li>बिहार</li>
<li>पंजाब</li>
<li>हरियाणा</li>
<li>पश्चिम बंगाल</li>
<li>असम</li>
</ul>

<h3>मुख्य फसलें</h3>

<p>
गेहूँ, धान, गन्ना, जूट
</p>

</div>

</div>

</div>

</div>

<script>

const soils = {

jalodh:{
img:"jalodh.png",
info:`
<h2>जलोढ़ मृदा</h2>

<p>
भारत की सबसे उपजाऊ मृदा।
गंगा, ब्रह्मपुत्र तथा सिंधु नदी तंत्र द्वारा निर्मित।
</p>

<h3>प्रमुख क्षेत्र</h3>

<ul>
<li>उत्तर प्रदेश</li>
<li>बिहार</li>
<li>पंजाब</li>
<li>हरियाणा</li>
<li>पश्चिम बंगाल</li>
<li>असम</li>
</ul>

<h3>मुख्य फसलें</h3>

<p>गेहूँ, धान, गन्ना, जूट</p>
`
},

lal:{
img:"lal.png",
info:`
<h2>लाल एवं पीली मृदा</h2>

<p>
लौह ऑक्साइड की अधिकता के कारण लाल रंग।
</p>

<h3>प्रमुख क्षेत्र</h3>

<ul>
<li>ओडिशा</li>
<li>झारखंड</li>
<li>छत्तीसगढ़</li>
<li>तेलंगाना</li>
<li>तमिलनाडु</li>
</ul>

<h3>मुख्य फसलें</h3>

<p>मूंगफली, बाजरा, दालें</p>
`
},

kali:{
img:"kali.png",
info:`
<h2>काली मृदा</h2>

<p>
रेगर मृदा के नाम से प्रसिद्ध।
कपास के लिए सर्वश्रेष्ठ।
</p>

<h3>प्रमुख क्षेत्र</h3>

<ul>
<li>महाराष्ट्र</li>
<li>मध्य प्रदेश</li>
<li>गुजरात</li>
<li>तेलंगाना</li>
</ul>

<h3>मुख्य फसल</h3>

<p>कपास</p>
`
},

laterite:{
img:"laterite.png",
info:`
<h2>लेटराइट मृदा</h2>

<p>
अधिक वर्षा एवं तापमान वाले क्षेत्रों में विकसित।
</p>

<h3>प्रमुख क्षेत्र</h3>

<ul>
<li>केरल</li>
<li>कर्नाटक</li>
<li>तमिलनाडु</li>
<li>ओडिशा</li>
</ul>

<h3>मुख्य फसलें</h3>

<p>चाय, कॉफी, रबर</p>
`
},

parvatiy:{
img:"parvatiy.png",
info:`
<h2>पर्वतीय मृदा</h2>

<p>
हिमालयी क्षेत्रों में पाई जाती है।
</p>

<h3>प्रमुख क्षेत्र</h3>

<ul>
<li>जम्मू-कश्मीर</li>
<li>हिमाचल प्रदेश</li>
<li>उत्तराखंड</li>
<li>अरुणाचल प्रदेश</li>
</ul>

<h3>मुख्य फसलें</h3>

<p>सेब, चाय, आलू</p>
`
}

};

function showSoil(type){

document.getElementById("soilMap").src =
soils[type].img;

document.getElementById("info").innerHTML =
soils[type].info;

}

function comingSoon(){

document.getElementById("info").innerHTML = `
<h2>शीघ्र उपलब्ध</h2>

<p>
इस मृदा का मानचित्र अभी जोड़ा जाना बाकी है।
</p>
`;

}

</script>

</body>
</html>
